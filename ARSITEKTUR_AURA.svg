<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Arsitektur Umum AURA</title>
  <desc id="desc">Diagram yang menunjukkan aplikasi AURA lokal dan di Vercel, Ollama dengan BGE-M3, DataByte dengan MiniMax-M3.1-Flash, Supabase, serta peran npm.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#edf3f7"/></linearGradient>
    <linearGradient id="local" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f7f3"/><stop offset="1" stop-color="#f4fbf8"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0edff"/><stop offset="1" stop-color="#faf9ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183142" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6a7f8d"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22856e"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7456c8"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#cf7629"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#183142}
      .title{font-size:38px;font-weight:750;letter-spacing:-.6px}
      .subtitle{font-size:17px;fill:#617684}
      .section{font-size:19px;font-weight:700}
      .label{font-size:16px;font-weight:650}
      .small{font-size:14px;fill:#617684}
      .tiny{font-size:12px;fill:#617684}
      .node{fill:#fff;stroke:#d8e2e8;stroke-width:1.5}
      .line{fill:none;stroke:#6a7f8d;stroke-width:2.3;marker-end:url(#arrow)}
      .lineGreen{fill:none;stroke:#22856e;stroke-width:2.5;marker-end:url(#arrowGreen)}
      .linePurple{fill:none;stroke:#7456c8;stroke-width:2.5;marker-end:url(#arrowPurple)}
      .lineOrange{fill:none;stroke:#cf7629;stroke-width:2.5;marker-end:url(#arrowOrange)}
      .dash{stroke-dasharray:7 7}
    </style>
  </defs>

  <rect width="1600" height="1120" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" class="title">Arsitektur Umum AURA</text>
  <text x="72" y="108" class="subtitle">Dokumen dan autentikasi di Supabase · embedding lokal dengan BGE-M3 · draft dibuat oleh MiniMax melalui DataByte</text>

  <!-- npm and user entry points -->
  <g filter="url(#shadow)">
    <rect x="72" y="142" width="300" height="83" rx="17" class="node"/>
    <rect x="72" y="142" width="8" height="83" rx="4" fill="#526b7a"/>
    <text x="100" y="176" class="label">npm</text>
    <text x="100" y="199" class="small">dependency · dev · build</text>
    <rect x="622" y="142" width="356" height="83" rx="17" class="node"/>
    <circle cx="658" cy="184" r="17" fill="#e8eff4"/>
    <path d="M650 184h16M658 176v16" stroke="#526b7a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="688" y="178" class="label">Pengguna</text>
    <text x="688" y="201" class="small">browser · login · buat draft</text>
  </g>
  <path d="M372 184H520Q552 184 552 212V273" class="line dash"/>
  <text x="389" y="169" class="tiny">menjalankan aplikasi</text>

  <!-- environment panels -->
  <rect x="60" y="260" width="700" height="382" rx="24" fill="url(#local)" stroke="#b9ded3" stroke-width="1.7"/>
  <rect x="840" y="260" width="700" height="382" rx="24" fill="url(#cloud)" stroke="#d2c9f2" stroke-width="1.7"/>
  <circle cx="94" cy="298" r="8" fill="#22856e"/>
  <text x="114" y="305" class="section">AURA lokal — laptop</text>
  <text x="114" y="329" class="small">Next.js server lokal mengakses Ollama di laptop yang sama</text>
  <circle cx="874" cy="298" r="8" fill="#7456c8"/>
  <text x="894" y="305" class="section">AURA online — Vercel</text>
  <text x="894" y="329" class="small">Vercel menjalankan API; tidak dapat mengakses Ollama laptop</text>

  <!-- flow arrows behind local nodes -->
  <path d="M800 225V247Q800 270 777 270H678V358" class="lineGreen"/>
  <path d="M222 406V458" class="lineGreen"/>
  <path d="M396 512H451" class="lineGreen"/>
  <path d="M625 512H682V406" class="lineGreen"/>
  <path d="M550 566V696Q550 724 578 724H676V778" class="lineGreen"/>
  <path d="M724 406H795Q818 406 818 429V742Q818 764 796 764H764V778" class="lineOrange"/>

  <!-- flow arrows behind cloud nodes -->
  <path d="M800 225V246Q800 270 824 270H931V358" class="linePurple"/>
  <path d="M931 406V458" class="linePurple"/>
  <path d="M1110 512H1163" class="linePurple"/>
  <path d="M1375 512H1430V406" class="linePurple"/>
  <path d="M1270 566V696Q1270 724 1240 724H975V778" class="linePurple"/>
  <path d="M1480 406H1510V744Q1510 764 1490 764H1372V778" class="lineOrange"/>

  <!-- local nodes -->
  <g filter="url(#shadow)">
    <rect x="105" y="358" width="235" height="96" rx="17" class="node"/>
    <rect x="105" y="358" width="7" height="96" rx="3.5" fill="#22856e"/>
    <text x="130" y="393" class="label">AURA · Next.js</text>
    <text x="130" y="418" class="small">UI + API routes</text>
    <text x="130" y="439" class="tiny">extract · chunk · search · draft</text>
    <rect x="105" y="470" width="290" height="96" rx="17" class="node"/>
    <text x="130" y="506" class="label">Ollama lokal</text>
    <text x="130" y="531" class="small">HTTP · 127.0.0.1:11434</text>
    <text x="130" y="552" class="tiny">endpoint /api/embed</text>
    <rect x="455" y="470" width="270" height="96" rx="17" class="node"/>
    <circle cx="484" cy="501" r="12" fill="#e4f4ee"/>
    <text x="508" y="506" class="label">BGE-M3 · BAAI</text>
    <text x="480" y="532" class="small">embedding multilingual</text>
    <text x="480" y="553" class="tiny">vektor 1024 dimensi</text>
  </g>
  <text x="112" y="594" class="tiny">Pertanyaan → embedding → pencarian semantik lokal</text>
  <text x="408" y="494" class="tiny" fill="#22856e">teks</text>
  <text x="643" y="494" class="tiny" fill="#22856e">vektor</text>

  <!-- cloud nodes -->
  <g filter="url(#shadow)">
    <rect x="855" y="358" width="255" height="96" rx="17" class="node"/>
    <rect x="855" y="358" width="7" height="96" rx="3.5" fill="#7456c8"/>
    <text x="880" y="393" class="label">AURA · Next.js</text>
    <text x="880" y="418" class="small">Vercel Functions</text>
    <text x="880" y="439" class="tiny">UI + API routes</text>
    <rect x="855" y="470" width="255" height="96" rx="17" class="node"/>
    <text x="880" y="506" class="label">Embedding cloud</text>
    <text x="880" y="531" class="small">provider OpenAI</text>
    <text x="880" y="552" class="tiny">hanya untuk deployment cloud</text>
    <rect x="1165" y="470" width="300" height="96" rx="17" class="node"/>
    <text x="1190" y="506" class="label">Embedding cloud</text>
    <text x="1190" y="531" class="small">vektor 1536 dimensi</text>
    <text x="1190" y="552" class="tiny">indeks terpisah di Supabase</text>
  </g>
  <text x="865" y="594" class="tiny">Vercel tidak memakai model Ollama di laptop</text>
  <text x="1120" y="494" class="tiny" fill="#7456c8">teks</text>
  <text x="1390" y="494" class="tiny" fill="#7456c8">vektor</text>

  <!-- shared services -->
  <rect x="60" y="690" width="1480" height="370" rx="25" fill="#fff" stroke="#d9e4ea" stroke-width="1.7"/>
  <text x="92" y="735" class="section">Layanan bersama</text>
  <text x="92" y="759" class="small">AURA lokal dan Vercel terhubung ke project Supabase dan API DataByte yang sama</text>
  <g filter="url(#shadow)">
    <rect x="95" y="790" width="860" height="215" rx="20" fill="#f3faf7" stroke="#b9ded3" stroke-width="1.5"/>
    <text x="128" y="831" class="section" fill="#1b725d">Supabase</text>
    <rect x="125" y="856" width="230" height="112" rx="15" class="node"/>
    <text x="148" y="892" class="label">Auth</text>
    <text x="148" y="919" class="small">pengguna · sesi</text>
    <text x="148" y="944" class="tiny">publishable key</text>
    <rect x="380" y="856" width="290" height="112" rx="15" class="node"/>
    <text x="403" y="892" class="label">PostgreSQL + pgvector</text>
    <text x="403" y="919" class="small">project · metadata · chunks</text>
    <text x="403" y="944" class="tiny">kb_chunks_local · kb_chunks</text>
    <rect x="695" y="856" width="230" height="112" rx="15" class="node"/>
    <text x="718" y="892" class="label">Private Storage</text>
    <text x="718" y="919" class="small">PDF · DOCX · XLSX</text>
    <text x="718" y="944" class="tiny">secret key di server</text>

    <rect x="1010" y="790" width="490" height="215" rx="20" fill="#fff8ef" stroke="#efd3b5" stroke-width="1.5"/>
    <text x="1043" y="831" class="section" fill="#a95d21">DataByte AI Gateway</text>
    <rect x="1040" y="856" width="430" height="112" rx="15" class="node"/>
    <text x="1065" y="892" class="label">MiniMax-M3.1-Flash</text>
    <text x="1065" y="919" class="small">membuat / memperbarui draft</text>
    <text x="1065" y="944" class="tiny">prompt + sumber terpilih → draft</text>
  </g>

  <!-- connection labels -->
  <rect x="95" y="1021" width="1410" height="1" fill="#e5ecef"/>
  <text x="100" y="1045" class="tiny">npm memasang dependency dan menjalankan build; npm bukan server AI. File sumber dan vektor tersimpan di Supabase.</text>
  <text x="1360" y="1045" class="tiny">AURA · 2026</text>
</svg>
